# ARQUIVO: .semgrep.yml (CORRIGIDO)
rules:
  - id: js-eval-detect
    message: "Uso de eval() detectado — evita eval() por motivos de segurança."
    severity: ERROR
    languages:
      - javascript
      - nodejs
      - typescript
    pattern: eval(...)

  - id: js-hardcoded-secret
    message: "Possível secret hardcoded (apiKey/token/secret)."
    severity: WARNING
    languages:
      - javascript
      - nodejs
      - typescript
    pattern-regex: '(api[_-]?key|token|secret|passwd).{0,40}["''][A-Za-z0-9\-_]{8,}["'']'

  - id: js-innerHTML
    message: "Atribuição a innerHTML detectada — pode provocar XSS."
    severity: WARNING
    languages:
      - javascript
      - nodejs
      - typescript
    pattern: |
      $EL.innerHTML = $X