name: CI/CD DevSecOps (Build + SAST Semgrep + Deploy automático no Vercel)

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com Jest
        run: npm test

  semgrep-scan:
    name: SAST — Análise de segurança com Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Semgrep via pip
        run: |
          python3 -m pip install --upgrade pip semgrep

      - name: Executar análise Semgrep
        run: |
          semgrep --config .semgrep.yml --json > semgrep-report.json || true
          echo "----- RESULTADO DA ANÁLISE -----"
          cat semgrep-report.json

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
