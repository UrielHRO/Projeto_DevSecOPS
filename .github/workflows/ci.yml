name: CI/CD DevSecOps (Build + SAST Semgrep + DAST ZAP)

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com Jest
        run: npm test

  semgrep-scan:
    name: SAST — Análise de segurança com Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Semgrep via pip
        run: |
          python3 -m pip install --upgrade pip semgrep

      - name: Executar análise Semgrep
        run: |
          semgrep --config .semgrep.yml --json > semgrep-report.json || true
          echo "----- RESULTADO DA ANÁLISE SAST (SEMGREP) -----"
          cat semgrep-report.json

      - name: Upload do relatório SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  zap-scan:
    name: DAST - Análise de segurança com OWASP ZAP
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      issues: write
    steps:
      - name: Aguardar Deploy da Vercel
        run: sleep 45 # Pausa para garantir que a nova versão do site está no ar

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'https://projeto-dev-sec-ops.vercel.app/'
          # CORRIGIDO: O nome correto do parâmetro é 'token'
          token: ${{ secrets.GITHUB_TOKEN }}
          # CORRIGIDO: Definindo um nome explícito para o artefato
          artifact_name: 'zap-report'